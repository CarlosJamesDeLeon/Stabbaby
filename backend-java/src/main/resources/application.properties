server.port=8080
spring.application.name=stabbaby-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:stabbabydb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

stabbaby.cors.allowed-origins=http://localhost:3000,http://localhost:5173


philsms.api.token=${PHILSMS_API_TOKEN:}
philsms.sender.id=${PHILSMS_SENDER_ID:}
stabbaby.sms.enabled=${SMS_REMINDERS_ENABLED:false}
stabbaby.sms.hours-before=${SMS_REMINDER_HOURS_BEFORE:24}
