server.port=8080
spring.application.name=stabbaby-backend

# Optional local file for secrets (not committed to Git)
spring.config.import=optional:file:./application-local.properties

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/stabbaby_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=stabbaby_user
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

stabbaby.cors.allowed-origins=http://localhost:3000,http://localhost:5173