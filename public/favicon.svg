<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="pinkGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF85C0"/>
      <stop offset="50%" stop-color="#E86BA8"/>
      <stop offset="100%" stop-color="#80184A"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark chic backdrop -->
  <rect width="100" height="100" rx="24" fill="#0D050B"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#E86BA8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  
  <!-- Main Piercing Ring -->
  <circle cx="44" cy="52" r="26" fill="none" stroke="url(#pinkGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Interlocking Secondary Mini Ring / Dermal stud -->
  <circle cx="68" cy="40" r="13" fill="none" stroke="#5CC8F0" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Dermal Gem Bead -->
  <circle cx="68" cy="40" r="4" fill="#FFFFFF"/>
  <circle cx="44" cy="26" r="4.5" fill="#FFFFFF" filter="url(#glow)"/>
  
  <!-- Iconic Stabbaby ✦ Star Sparkle -->
  <path d="M 50 8 Q 50 20 62 20 Q 50 20 50 32 Q 50 20 38 20 Q 50 20 50 8 Z" fill="#5CC8F0"/>
  <path d="M 22 68 Q 22 75 29 75 Q 22 75 22 82 Q 22 75 15 75 Q 22 75 22 68 Z" fill="#E86BA8"/>
</svg>
